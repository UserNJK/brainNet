[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioneuron"
version = "1.5.0"
description = "Biologically accurate spiking neural network — STDP, neurochemistry, and closed-loop reinforcement learning"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jugal Kishore Nagulapalli" }]
keywords = [
    "spiking neural network", "SNN", "STDP", "neuroscience",
    "computational neuroscience", "neuromorphic", "reinforcement learning",
    "neurochemistry", "plasticity",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.21",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
dev = ["build", "pytest"]

[project.scripts]
bioneuron = "bioneuron.cli:main"

# NOTE: the importable package name is `bioneuron`, but the source still lives in
# src/ (the original layout). This mapping installs src/ as the `bioneuron`
# package. If `bioneuron` is taken on PyPI, change `name` above and the keys here.
[tool.setuptools]
packages = ["bioneuron"]
package-dir = { "bioneuron" = "src" }
